<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заявки на звіти</title>
<meta name="robots" content="noindex">
<script src="https://accounts.google.com/gsi/client" async></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar + one working area (board / list / form / load / how) + right-side drawer for a request card */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#F6F8F7; --ink:#14201E; --muted:#5A6A67; --line:#D8E0DE;
  --accent:#0E6B63; --accent-ink:#FFFFFF; --accent-soft:#DCEFEC;
  --p1:#C0392B; --p1-soft:#FBE3E0; --p2:#C46A12; --p2-soft:#FCEBD7; --p3:#3C5A80; --p3-soft:#E1E9F4; --p4:#6B7472; --p4-soft:#ECEFEE;
  --st-new:#2F6FD0; --st-clarify:#B7791F; --st-queued:#5F6F8A; --st-progress:#0E6B63; --st-review:#7B4BC4; --st-done:#2E8540; --st-rejected:#8A8F8E;
  --demo:#8A5A00; --demo-soft:#FFF1CC;
  --shadow:0 10px 30px rgba(14,40,36,.14);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1514; --surface:#172020; --surface-2:#1C2726; --ink:#E4ECEA; --muted:#93A4A0; --line:#2A3735;
  --accent:#4CC2B6; --accent-ink:#06211E; --accent-soft:#163633;
  --p1:#F07A6C; --p1-soft:#3A1E1B; --p2:#F0A55A; --p2-soft:#3A2A16; --p3:#8DB0E0; --p3-soft:#1D2A3B; --p4:#A3ADAB; --p4-soft:#232C2B;
  --st-new:#7AA8F0; --st-clarify:#E6B154; --st-queued:#A2B0C8; --st-progress:#4CC2B6; --st-review:#B89AF0; --st-done:#6CCB7E; --st-rejected:#8F9998;
  --demo:#F2C14E; --demo-soft:#3A2F12; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#172020; --surface-2:#1C2726; --ink:#E4ECEA; --muted:#93A4A0; --line:#2A3735;
  --accent:#4CC2B6; --accent-ink:#06211E; --accent-soft:#163633;
  --p1:#F07A6C; --p1-soft:#3A1E1B; --p2:#F0A55A; --p2-soft:#3A2A16; --p3:#8DB0E0; --p3-soft:#1D2A3B; --p4:#A3ADAB; --p4-soft:#232C2B;
  --st-new:#7AA8F0; --st-clarify:#E6B154; --st-queued:#A2B0C8; --st-progress:#4CC2B6; --st-review:#B89AF0; --st-done:#6CCB7E; --st-rejected:#8F9998;
  --demo:#F2C14E; --demo-soft:#3A2F12; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.02em}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:13px}
.brand b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:12px}
.who{display:flex;align-items:center;gap:8px}
.who label{color:var(--muted);font-size:12px}
.who select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);max-width:240px}
.bell{position:relative;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:6px}
.bell .dot{min-width:18px;height:18px;border-radius:9px;background:var(--p1);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-bottom:0}
nav.tabs a{padding:10px 12px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs a.cta{color:var(--accent);font-weight:600}

main{padding-block:20px 60px}
h1{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 4px;text-wrap:balance}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px;max-width:70ch}
.demo-note{display:flex;gap:8px;align-items:flex-start;background:var(--demo-soft);color:var(--ink);border-radius:10px;padding:10px 12px;margin-bottom:16px;font-size:13px;max-width:900px}
.demo-note b{color:var(--demo)}

/* chips & pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.prio{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:5px;font-weight:500}
.prio.P1{background:var(--p1-soft);color:var(--p1)} .prio.P2{background:var(--p2-soft);color:var(--p2)}
.prio.P3{background:var(--p3-soft);color:var(--p3)} .prio.P4{background:var(--p4-soft);color:var(--p4)}
.prio.none{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)}
.tag-demo{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--demo);background:var(--demo-soft);padding:1px 6px;border-radius:4px}
.dept{font-size:12px;color:var(--muted)}
.ava{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.ava.none{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap;line-height:1.5}
.chip.ok{background:color-mix(in srgb,var(--st-done) 12%,var(--surface));color:var(--st-done);border-color:transparent}
.chip.bad{background:color-mix(in srgb,var(--p1) 12%,var(--surface));color:var(--p1);border-color:transparent}
.chip.warn{background:color-mix(in srgb,var(--st-clarify) 14%,var(--surface));color:var(--st-clarify);border-color:transparent}

/* board — канбан */
.bhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;margin-bottom:14px}
.bhead .sub{margin:0}
.bstats{display:flex;gap:8px;flex-wrap:wrap}
.bstat{display:flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:12.5px;color:var(--muted)}
.bstat b{font-size:17px;color:var(--ink);font-weight:600}
.bstat.alert b{color:var(--p1)}
.btools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.btools select{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0;max-width:100%}
.search{flex:1 1 240px;max-width:380px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;padding:7px 0;outline:none}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent)}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(212px,1fr);gap:14px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x proximity;align-items:start}
.kcol{--c:var(--muted);scroll-snap-align:start;background:color-mix(in srgb,var(--c) 5%,var(--surface-2));border:1px solid var(--line);border-radius:14px;box-shadow:inset 0 3px 0 var(--c);padding:12px 10px 10px;display:flex;flex-direction:column;gap:8px;min-height:260px;transition:background .15s,border-color .15s}
.kcol.drop{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface-2))}
.kcol-h{display:flex;align-items:center;gap:8px;padding:0 4px}
.kcol-h .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.kcol-h b{font-size:13.5px}
.kcol-h .cnt{margin-left:auto;font-size:12px;font-weight:600;min-width:24px;text-align:center;padding:1px 7px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.kcol-hint{font-size:11.5px;color:var(--muted);margin:-2px 4px 2px}
.kcol-empty{font-size:12px;color:var(--muted);text-align:center;padding:22px 6px;border:1.5px dashed var(--line);border-radius:10px}
.kc{--pc:var(--line);position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px 10px 15px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;box-shadow:0 1px 2px rgba(14,40,36,.05);transition:transform .12s ease,box-shadow .12s ease,border-color .12s}
.kc::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--pc)}
.kc:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 6px 16px rgba(14,40,36,.10)}
@media (prefers-reduced-motion:no-preference){.kc:hover{transform:translateY(-1px)}}
.kc[draggable="true"]{cursor:grab}
.kc.dragging{opacity:.45}
.kc-top{display:flex;align-items:center;gap:6px;min-width:0}
.kc-id{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.kc-type{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kc-t{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.kc-tags{display:flex;gap:5px;flex-wrap:wrap}
.kc-prog{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.kc-prog span{display:block;height:100%;border-radius:2px;background:var(--accent)}
.kc-prog.over span{background:var(--p2)}
.kc-foot{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.kc-foot .i{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.kc-foot svg{flex:none}
.kc-foot .late{color:var(--p1);font-weight:600}
.kc-foot .soon{color:var(--p2);font-weight:600}
.kc-foot .ava{margin-left:auto}
.kc-hrs{font-variant-numeric:tabular-nums}
.kc.q{background:color-mix(in srgb,var(--st-clarify) 5%,var(--surface))}
@media (max-width:640px){.kanban{grid-auto-columns:84%}.bstat b{font-size:15px}}

/* аналітика */
.viz{--viz-in:#2a78d6;--viz-out:#eb6834}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:4px}
.tile .lbl{font-size:12.5px;color:var(--muted)}
.tile .val{font-size:30px;font-weight:600;line-height:1.1}
.tile .dl{font-size:12px;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.ccard.wide{grid-column:1/-1}
.ccard h2{margin:0;font-size:15px}
.ccard .cap{margin:-4px 0 0;font-size:12.5px;color:var(--muted)}
.chart{position:relative;min-height:200px}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:var(--f-body);font-size:11.5px;fill:var(--muted)}
.chart .lbl-strong{fill:var(--ink);font-weight:600}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:default;outline:none}
.chart .hit:hover,.chart .hit:focus-visible{fill:color-mix(in srgb,var(--ink) 5%,transparent)}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend-row i.line{height:2px;width:14px;border-radius:1px}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg2 button{border:0;background:none;padding:6px 12px;font-size:13px;color:var(--muted)}
.seg2 button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px;font-size:12.5px;min-width:150px;display:grid;gap:3px}
.tip .h{color:var(--muted);font-size:12px;margin-bottom:2px}
.tip .r{display:flex;align-items:center;gap:8px}
.tip .r i{width:12px;height:2px;border-radius:1px;flex:none}
.tip .r b{font-variant-numeric:tabular-nums;min-width:22px}
.tip .r span{color:var(--muted)}
.empty-viz{color:var(--muted);font-size:13px;padding:30px 0;text-align:center}
details.tv summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600}
details.tv table{min-width:0}

/* list */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.filters input{flex:1 1 200px;min-width:0}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--surface-2)}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--surface-2)}
td.num{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}

/* form */
.form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:880px;display:grid;gap:18px}
.fs{display:grid;gap:12px}
.fs-h{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.fs-h span{font-family:var(--f-mono);font-size:11px;color:var(--accent)}
.fs-h b{font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:grid;gap:5px;min-width:0}
.fld label{font-weight:600;font-size:13px}
.fld .hint{font-size:12px;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.fld textarea{min-height:84px;resize:vertical}
.req::after{content:" *";color:var(--p1)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{font-weight:500;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;background:var(--surface-2);font-size:13px}
.seg input:checked+label{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.drop-zone{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);background:var(--surface-2)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;background:var(--surface)}
.thumb img{width:34px;height:34px;object-fit:cover;border-radius:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{color:var(--p1);border-color:var(--p1-soft)}
.btn.sm{padding:5px 10px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* load */
.load-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kv{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 10px}
.kv div{display:grid}
.kv b{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--muted)}
.mini{display:grid;gap:6px}
.mini button{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:6px 8px;text-align:left}
.mini button span.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* how */
.how{display:grid;gap:16px;max-width:980px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.step .no{font-family:var(--f-mono);font-size:11px;color:var(--accent)}
.step b{display:block;margin:2px 0 4px}
.step p{margin:0;color:var(--muted);font-size:13px}
.legend{display:grid;gap:6px}
.legend div{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start}
.legend p{margin:0;color:var(--muted);font-size:13px}
.arch{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.arch .panel b{display:block;margin-bottom:4px}
.arch .panel p,.arch .panel li{color:var(--muted);font-size:13px;margin:0}
.arch ul{margin:0;padding-left:18px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.d-head{padding:14px 18px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.d-head .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.d-head h2{font-size:18px;margin:0;text-wrap:balance}
.x{margin-left:auto;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;width:32px;height:32px}
.d-body{overflow-y:auto;padding:16px 18px;display:grid;gap:18px;align-content:start}
.sec-h{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:0 0 8px}
dl.facts{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0}
dl.facts dt{color:var(--muted);font-size:13px}
dl.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.text-block{background:var(--surface-2);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.analyst{background:var(--accent-soft);border-radius:12px;padding:12px;display:grid;gap:10px}
.analyst .grid2 .fld input,.analyst .grid2 .fld select{background:var(--surface)}
.callout{border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.callout.review{background:color-mix(in srgb,var(--st-review) 14%,var(--surface))}
.callout.clarify{background:color-mix(in srgb,var(--st-clarify) 16%,var(--surface))}
.thread{display:grid;gap:10px}

<body>
<style>

<div id="busy" class="busy" hidden></div>
<header class="top" id="top" hidden>
  <div class="wrap top-in">
    <div class="brand"><div class="brand-mark">AN</div><div><b>Заявки на звіти</b><small>Відділ аналітики</small></div></div>

</header>
<main class="wrap" id="app"><div class="gate"><b>Завантаження…</b></div></main>
<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="Картка заявки"></aside>
<div id="toast" class="toast" hidden></div>

<script>
// Адреса Apps Script (введення в дію, закінчується на /exec)
const API_URL = "https://script.google.com/macros/s/AKfycbzEuICg8E-FJApZ1UXIougeeIWdHbLXv5rxvFh8rSOLi9wjRf9AoiXgH5GbGtbJBLF3/exec";
const _q = new URLSearchParams(location.search);
const _clean = v => String(v || "").replace(/[^A-Za-z0-9]/g, "");
let TOKEN = (() => {
  const k = _clean(_q.get("k")), r = _clean(_q.get("r"));
  if (k) { try { localStorage.setItem("zv_token", k); } catch (e) { } }
  if (k || r) { // прибираємо ключ з адресного рядка, щоб його не переслали випадково
    const rest = new URLSearchParams(location.search); rest.delete("k");
    if (k) history.replaceState(null, "", location.pathname + (rest.toString() ? "?" + rest : ""));
  }
  if (r) return "r_" + r;
  if (k) return k;
  try { return localStorage.getItem("zv_token") || ""; } catch (e) { return ""; }
})();
const OPEN_ID = String(_q.get("id") || "").replace(/[^A-Za-z0-9-]/g, "");

const S = { pending: {}, me: null, items: [], analysts: [], names: {}, D: null, view: "board", open: null,
  filters: { dept: "", status: "", who: "", q: "" }, files: [], busy: 0, draft: {} };

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = ts => { if (!ts) return "—"; const d = new Date(ts); return d.toLocaleDateString("uk-UA", { day: "2-digit", month: "2-digit", year: "2-digit" }) + " " + d.toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" }); };
const ymd = s => { const m = String(s || "").match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? m[3] + "." + m[2] + "." + m[1] : (s || "—"); };
const ago = ts => { if (!ts) return "—"; const m = Math.round((Date.now() - ts) / 60000); if (m < 1) return "щойно"; if (m < 60) return m + " хв тому"; const h = Math.round(m / 60); if (h < 24) return h + " год тому"; return Math.round(h / 24) + " дн тому"; };
const isLead = () => S.me && S.me.role === "lead";
const isHead = () => S.me && S.me.role === "customer";
const isGuest = () => S.me && (S.me.role === "public" || S.me.role === "requester");
const isAnalyst = () => S.me && (S.me.role === "lead" || S.me.role === "analyst");
const isExec = () => S.me && S.me.role === "exec";       // виконавчий директор: бачить усе, коментує, змінює пріоритет
const seesAll = () => isAnalyst() || isExec();
const OPEN_DEC = ["new", "clarify", "queued", "progress"]; // коли керівник відділу може погодити / відхилити заявку
const canDecide = it => isHead() && S.me.dept === it.dept && it.createdBy !== S.me.id && OPEN_DEC.includes(it.status);
const PRIO_OPTS = [["", "— не задано"], ["P1", "P1 — терміново"], ["P2", "P2 — високий"], ["P3", "P3 — плановий"], ["P4", "P4 — коли буде час"]];
const nameOf = id => S.names[id] || id || "—";
const initials = id => id ? String(nameOf(id)).slice(0, 1) : "?";
const SL = () => S.D.status;
const pillSt = k => `<span class="pill" style="color:var(--st-${k});background:color-mix(in srgb,var(--st-${k}) 13%,transparent)">${SL()[k] || k}</span>`;
const prioTag = p => p ? `<span class="prio ${p}">${p}</span>` : `<span class="prio none">P?</span>`;
const hrs = v => v === "" || v == null ? "—" : v;
const PR = { P1: 1, P2: 2, P3: 3, P4: 4 };
const byPrio = (a, b) => (PR[a.prio] || 9) - (PR[b.prio] || 9) || a.created - b.created;
// Власник заявки: хто її створив; керівник цього відділу; або замовник, що відкрив її за посиланням з листа (?r=) —
// навіть якщо заявку внесла за нього Юлія. Сервер за таким посиланням повертає лише цю одну заявку.
const isOwner = it => S.me && (S.me.id === it.createdBy || S.me.id === "req:" + it.id || (S.me.role === "customer" && S.me.dept === it.dept));
const isMine = it => isAnalyst() ? it.who === S.me.id : isExec() ? it.createdBy === S.me.id : true;
const STATUS_ORDER = ["new", "clarify", "queued", "progress", "review", "done", "rejected"];
const HINT = { new: "Чекає розбору аналітиком", clarify: "Є питання до замовника", queued: "Оцінено, чекає виконавця", review: "Замовник перевіряє результат" };

function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3200); }
function setBusy(on) { S.busy += on ? 1 : -1; $("#busy").hidden = S.busy <= 0; document.querySelectorAll("[data-busy]").forEach(b => b.disabled = S.busy > 0); }

function call(action, payload) {
  if (!(window.google && google.script && google.script.run)) {
    // інтерфейс розміщено окремо — звертаємось до Apps Script як до API
    return fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ token: TOKEN, action, payload: payload || {} }) })
      .then(r => r.text(), () => { throw new Error("Немає зв'язку з сервером. Перевірте інтернет і спробуйте ще раз"); })
      .then(t => { let o; try { o = JSON.parse(t); } catch (e) { throw new Error("Сервер відповів не так, як очікувалось. Перевірте API_URL і налаштування доступу «Усі»"); } if (!o.ok) throw new Error(o.error); return o.data; });
  }
  return new Promise((res, rej) => {
    google.script.run
      .withSuccessHandler(r => { let o; try { o = JSON.parse(r); } catch (e) { return rej(new Error("Некоректна відповідь сервера")); } o.ok ? res(o.data) : rej(new Error(o.error)); })
      .withFailureHandler(e => rej(new Error((e && e.message) || "Помилка з'єднання")))
      .api(TOKEN, action, payload || {});
  });
}
async function act(action, payload, okMsg) {
  setBusy(true);
  try { const st = await call(action, payload); apply(st); if (okMsg) toast(typeof okMsg === "function" ? okMsg(st) : okMsg); return st; }
  catch (e) { if (e.message === "NO_ACCESS") return noAccess(); toast(e.message); render(); throw e; }
  finally { setBusy(false); }
}
function apply(st) { if (st.googleClientId !== undefined) S.googleClientId = st.googleClientId; S.me = st.me; S.items = st.items; S.analysts = st.analysts; S.names = st.names; S.D = st.dicts; S.admin = st.admin; render(); }
function noAccess() {
  if (API_URL && TOKEN && TOKEN === store.get()) { store.clear(); location.replace(location.pathname); return; }
  $("#top").hidden = true;
  $("#app").innerHTML = `<div class="gate"><h1>Немає доступу</h1><p class="sub" style="margin:0">Посилання застаріло або доступ вимкнено. Щоб подати заявку, відкрийте загальне посилання на систему заявок; якщо ви керівник відділу — попросіть Юлію надіслати нове персональне посилання.</p></div>`;
}

/* ---------- вхід ---------- */
const store = {
  get() { try { return localStorage.getItem("zv_token") || ""; } catch (e) { return ""; } },
  set(t) { try { localStorage.setItem("zv_token", t); } catch (e) { } },
  clear() { try { localStorage.removeItem("zv_token"); } catch (e) { } }
};
let gsiReady = false;
function renderGsi() {
  const box = $("#gsi"); if (!box) return;
  const cid = S.googleClientId;
  const show = S.me && S.me.role === "public" && cid && window.google && google.accounts && google.accounts.id && API_URL;
  box.hidden = !show; if (!show) return;
  if (!gsiReady) { google.accounts.id.initialize({ client_id: cid, callback: onGoogleCredential, auto_select: false, ux_mode: "popup" }); gsiReady = true; }
  if (!box.dataset.done) {
    box.innerHTML = `<small>Для керівників відділів і аналітиків</small><div id="gsiBtn"></div>`;
    google.accounts.id.renderButton($("#gsiBtn"), { theme: "outline", size: "medium", text: "signin_with", locale: "uk" });
    box.dataset.done = "1";
  }
}
function onGoogleCredential(resp) {
  setBusy(true);
  call("googleLogin", { credential: resp.credential })
    .then(st => { TOKEN = st.token; store.set(st.token); S.publicDone = null; S.view = "board"; $("#app").innerHTML = ""; apply(st); toast("Вітаємо, " + st.me.name + "!"); })
    .catch(e => toast(e.message))
    .finally(() => setBusy(false));
}
function logout() {
  store.clear();
  try { google.accounts.id.disableAutoSelect(); } catch (e) { }
  location.replace(location.pathname);
}

/* ---------- views ---------- */
function render() {
  if (!S.me) return;
  $("#top").hidden = false;
  const guest = isGuest();
  $("#tabs").hidden = guest; $("#refresh").hidden = S.me.role === "public"; $(".me").hidden = guest;
  $("#logout").hidden = !(API_URL && store.get());
  renderGsi();
  if (S.me.role === "public") { if (S.view !== "new" || !$("#nf")) { S.view = "new"; $("#app").innerHTML = S.publicDone ? vDone() : vNew(); if (!S.publicDone) bindForm(); } return; }
  if (S.me.role === "requester") { const it = S.items[0]; if (!it) return noAccess(); S.open = it.id;
    $("#app").innerHTML = `<div class="single">${cardHtml(it, true)}</div>`; bindCard(it); return; }
  $("#meName").textContent = S.me.name; $("#meTitle").textContent = S.me.title || S.me.dept || ""; $("#meAva").textContent = S.me.name.slice(0, 1);
  const mineBtn = document.querySelector('#tabs button[data-v="mine"]'); if (mineBtn) mineBtn.textContent = isHead() ? "Мій відділ" : isExec() ? "Мої заявки" : "Мої";
  const listBtn = document.querySelector('#tabs button[data-v="list"]'); if (listBtn) listBtn.textContent = isHead() ? "Список" : "Усі заявки";
  if ((S.view === "admin" && !isLead()) || (S.view === "load" && !seesAll())) S.view = "board";
  document.querySelectorAll("#tabs button").forEach(b => { b.classList.toggle("on", b.dataset.v === S.view); b.hidden = (b.dataset.staff && !seesAll()) || (b.dataset.lead && !isLead()); });
  const v = { board: vBoard, mine: vMine, list: vList, stats: vStats, new: vNew, load: vLoad, how: vHow, admin: vAdmin }[S.view] || vBoard;
  if (S.view === "new" && $("#nf")) { /* форму не перемальовуємо, щоб не губити введене */ }
  else { const y = window.scrollY; $("#app").innerHTML = v(); if (S.view === "new") bindForm(); else if (S.view === "stats") drawStats(); if (y && S.view !== "new") window.scrollTo(0, y); }
  if (S.open) renderDrawer(); else if (S.editUser) renderUserDrawer();
}

/* ---------- дошка (канбан) ---------- */
const pad2 = n => String(n).padStart(2, "0");
const todayYmd = () => { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); };
const plusDaysYmd = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); };
const dm = s => { const m = String(s || "").match(/^\d{4}-(\d{2})-(\d{2})$/); return m ? m[2] + "." + m[1] : ""; };
const numUa = v => String(v).replace(".", ",");
const isOpen = it => !["done", "rejected"].includes(it.status);
const isLate = it => !!it.due && ["new", "clarify", "queued", "progress"].includes(it.status) && it.due < todayYmd();
const PRIO_COLOR = { P1: "var(--p1)", P2: "var(--p2)", P3: "var(--p3)", P4: "var(--p4)" };
const ICO = {
  cal: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 7h12M5.5 1.5v3M10.5 1.5v3"/></svg>',
  msg: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z" stroke-linejoin="round"/></svg>',
  clock: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg>',
  search: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>'
};
const fMatch = it => { const f = S.filters;
  return (!f.dept || it.dept === f.dept) && (!f.who || (f.who === "none" ? !it.who : it.who === f.who)) &&
    (!f.q || (it.title + " " + it.id + " " + (it.requester || "")).toLowerCase().includes(f.q.toLowerCase())); };

function card(it) {
  const est = parseFloat(it.est), spent = parseFloat(it.spent);
  const cm = it.thread.filter(m => m.kind !== "system").length;
  let due = '<span class="i" title="Плановий термін ще не задано">' + ICO.cal + ' без терміну</span>';
  if (it.due) {
    const late = isLate(it), soon = !late && isOpen(it) && it.status !== "review" && it.due <= plusDaysYmd(1);
    due = `<span class="i ${late ? "late" : soon ? "soon" : ""}" title="Плановий термін: ${ymd(it.due)}${late ? " — прострочено" : ""}">${ICO.cal} ${dm(it.due)}</span>`;
  }

/* ---------- аналітика: потік заявок ---------- */
const DAY = 864e5;
const dayStart = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const weekStart = ts => { const d = new Date(dayStart(ts)); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); };
const addDays = (ts, n) => { const d = new Date(ts); d.setDate(d.getDate() + n); return d.getTime(); };
const ddmm = ts => { const d = new Date(ts); return pad2(d.getDate()) + "." + pad2(d.getMonth() + 1); };
/** Коли заявку закрито: остання системна відмітка «→ Готово / → Відхилено» в історії. */
function closedAt(it) {
  if (isOpen(it)) return 0;
  for (let i = it.thread.length - 1; i >= 0; i--) { const m = it.thread[i]; if (m.kind === "system" && /→ (Готово|Відхилено)/.test(m.text)) return m.ts; }
  return it.updated || it.created;
}
/** Періоди (дні або тижні) від першої заявки до сьогодні: надійшло, закрито, відкрито на кінець періоду. */
function flowData(items, gran) {
  if (!items.length) return [];
  const now = Date.now(), step = gran === "day" ? 1 : 7, startOf = gran === "day" ? dayStart : weekStart;
  const first = startOf(Math.min(...items.map(i => i.created || now))), maxB = gran === "day" ? 31 : 12;
  const starts = []; for (let s = startOf(now); s >= first && starts.length < maxB; s = addDays(s, -step)) starts.unshift(s);
  const cl = items.map(i => ({ it: i, c: closedAt(i) }));

   </div>` : `<dl class="facts"><dt>Пріоритет</dt><dd>${prioTag(it.prio)}</dd><dt>Виконавець</dt><dd>${it.who ? esc(nameOf(it.who)) : "—"}</dd><dt>Плановий термін</dt><dd>${ymd(it.due)}</dd><dt>Оцінка, год</dt><dd>${hrs(it.est)}</dd></dl>`;

     <div class="actions"><select id="d-prio" class="sel">${opt(PRIO_OPTS, anVal(it, "prio"))}</select>

  const decBox = canDecide(it) ? `<div class="callout decide"><b>Рішення керівника відділу</b>
     <div>${it.approval === "approved" ? `Ви погодили цю заявку ${fmt(it.approvalAt)}. Якщо передумали, її ще можна відхилити.` : "Погодьте заявку співробітника або відхиліть її. Це необов'язково: аналітики візьмуть заявку в роботу і без вашого рішення."}</div>
     <div class="actions">${it.approval === "approved" ? "" : '<button class="btn pri sm" data-act="approve" data-busy>Погодити</button>'}<button class="btn sm warn" data-act="reject" data-busy>Відхилити</button></div>
     <div class="dept">Щоб відхилити, спершу напишіть причину в полі коментаря нижче. Її побачить автор заявки, а заявка закриється.</div></div>` : "";
  const reviewBox = it.status === "review" ? `<div class="callout review"><b>Готово до перевірки</b><div>Де дивитись: ${link(it.result)}</div>${owner ? `<div class="actions"><button class="btn pri sm" data-act="accept" data-busy>Прийняти</button><button class="btn sm" data-act="return" data-busy>Повернути на доопрацювання</button></div><div class="dept">Щоб повернути, спершу напишіть у полі коментаря нижче, що треба доробити.</div>` : ""}</div>` : "";
  const lastQ = [...it.thread].reverse().find(m => m.kind === "question");
  const clarBox = it.status === "clarify" && lastQ ? `<div class="callout clarify"><b>Питання від аналітика</b><div style="white-space:pre-wrap">${esc(lastQ.text)}</div>${owner ? '<div class="dept">Відповідайте в обговоренні нижче — заявка автоматично повернеться в роботу.</div>' : ""}</div>` : "";

     <div class="actions">${an ? '<label class="chk"><input type="checkbox" id="d-q"> Це питання до замовника (статус → Уточнення)</label>' : ""}<button class="btn pri sm" data-act="send" data-busy style="margin-left:auto">Надіслати</button></div></div>` :
      '<div class="dept">Коментувати можуть аналітики, керівництво і відділ, який подав заявку.</div>'}
  </div>`;
}
function bindCard(it) {
  // аналітик редагує всі поля роботи; директор — лише пріоритет
  const fields = isAnalyst() ? AN_FIELDS : isExec() ? [["#d-prio", "prio"]] : null;
  $("#d-msg") && $("#d-msg").addEventListener("input", e => S.draft[it.id] = e.target.value);
  if (fields && $(fields[0][0])) {
    const idle = isAnalyst() ? "Змінюйте поля — збережеться все разом" : "Аналітики отримають сповіщення про зміну";
    const mark = () => {
      const p = {};
      fields.forEach(([sel, f]) => { const v = $(sel).value; if (String(v) !== String(it[f] == null ? "" : it[f])) p[f] = v; });
      if (Object.keys(p).length) S.pending[it.id] = p; else delete S.pending[it.id];
      const btn = $('[data-act="save-an"]'), dirty = !!S.pending[it.id];
      if (btn) btn.disabled = !dirty;
      const h = $("#an-hint"); if (h) h.textContent = dirty ? "Є незбережені зміни" : idle;
    };
    fields.forEach(([sel]) => { $(sel).addEventListener("input", mark); $(sel).addEventListener("change", mark); });
  }
}
async function sendMsg() {
  const it = S.items.find(i => i.id === S.open), t = ($("#d-msg").value || "").trim(); if (!t) return;
  const q = $("#d-q") && $("#d-q").checked;
  await act("comment", { id: it.id, text: t, question: q }, q ? "Питання надіслано замовнику" : "Коментар надіслано").then(() => { S.draft[it.id] = ""; const m = $("#d-msg"); if (m) m.value = ""; }).catch(() => {});
}

   ${A.appUrl ? "" : `<div class="warn-box">Адреса застосунку ще не збережена — посилання для людей з'являться після того, як ви відкриєте застосунок за URL розгортання (…/exec).</div>`}</div>

/* ---------- events ---------- */
function go(v) { S.view = v; S.open = S.open; $("#app").innerHTML = ""; render(); window.scrollTo(0, 0); }
document.addEventListener("click", e => {
  const tab = e.target.closest("#tabs button"); if (tab) { go(tab.dataset.v); return; }
  const rm = e.target.closest("[data-rmfile]"); if (rm) { S.files.splice(Number(rm.dataset.rmfile), 1); rm.parentElement.remove(); return; }
  const o = e.target.closest("[data-open]"); if (o) { openCard(o.dataset.open); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const it = S.items.find(i => i.id === S.open);
  if (a.dataset.act === "close") closeCard();
  if (a.dataset.act === "public-again") { S.publicDone = null; S.view = "new"; $("#app").innerHTML = ""; render(); window.scrollTo(0, 0); }
  if (a.dataset.act === "user-new") { S.open = null; S.editUser = "new"; renderUserDrawer(); }
  if (a.dataset.act === "user-edit") { S.open = null; S.editUser = a.dataset.id; renderUserDrawer(); }
  if (a.dataset.act === "user-invite") act("adminInvite", { id: S.editUser }, "Запрошення надіслано").catch(() => {});
  if (a.dataset.act === "user-reset") act("adminResetLink", { id: S.editUser }, "Нове посилання створено, старе більше не працює").catch(() => {});
  if (a.dataset.act === "user-toggle") act("adminToggleUser", { id: S.editUser }, "Доступ змінено").catch(() => {});
  if (a.dataset.act === "copy-pub") { const inp = $("#pub-link"); inp.select(); (navigator.clipboard ? navigator.clipboard.writeText(inp.value).then(() => toast("Посилання скопійовано")) : Promise.reject()).catch(() => { try { document.execCommand("copy"); toast("Посилання скопійовано"); } catch (e) { toast("Виділено — натисніть Ctrl+C"); } }); }
  if (a.dataset.act === "copy-link") { const inp = $("#u-link"); inp.select(); const done = () => toast("Посилання скопійовано");
    (navigator.clipboard ? navigator.clipboard.writeText(inp.value).then(done) : Promise.reject()).catch(() => { try { document.execCommand("copy"); done(); } catch (e) { toast("Виділено — натисніть Ctrl+C"); } }); }
  if (a.dataset.act === "dept-edit") { S.editDept = a.dataset.name; render(); const i = $("#dept-rename"); i && i.focus(); }
  if (a.dataset.act === "dept-cancel") { S.editDept = null; render(); }
  if (a.dataset.act === "dept-save") { const i = $("#dept-rename"); act("adminSaveDept", { old: i.dataset.old, name: i.value.trim() }, "Відділ перейменовано").then(() => { S.editDept = null; render(); }).catch(() => {}); }
  if (a.dataset.act === "dept-toggle") act("adminToggleDept", { name: a.dataset.name }, "Збережено").catch(() => {});
  if (a.dataset.act === "send") sendMsg();
  if (a.dataset.act === "save-an") saveAnalyst(S.open);
  if (a.dataset.act === "accept") act("customer", { id: it.id, action: "accept" }, "Прийнято. Дякуємо!").catch(() => {});
  if (a.dataset.act === "return") {
    const t = ($("#d-msg").value || "").trim();
    if (!t) { toast("Напишіть у коментарі, що саме треба доробити"); $("#d-msg").focus(); return; }
    act("customer", { id: it.id, action: "return", text: t }, "Повернуто на доопрацювання").then(() => { S.draft[it.id] = ""; }).catch(() => {});
  }
  if (a.dataset.act === "approve") act("customer", { id: it.id, action: "approve" }, "Заявку погоджено").catch(() => {});
  if (a.dataset.act === "reject") {
    const t = ($("#d-msg").value || "").trim();
    if (!t) { toast("Напишіть у коментарі причину — її побачить автор заявки"); $("#d-msg").focus(); return; }
    act("customer", { id: it.id, action: "reject", text: t }, "Заявку відхилено").then(() => { S.draft[it.id] = ""; }).catch(() => {});
  }
  if (a.dataset.act === "clear-f") { S.filters = { dept: "", status: "", who: "", q: "" }; render(); }
  if (a.dataset.act === "gran") { S.gran = a.dataset.g; render(); }
});
$("#logout").addEventListener("click", logout);
window.addEventListener("load", () => { if (S.me) renderGsi(); });
$("#refresh").addEventListener("click", () => act("boot", {}, "Оновлено").catch(() => {}));
$("#scrim").addEventListener("click", closeCard);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeCard(); });
$("#app").addEventListener("input", e => { if (e.target.id === "f-q") { S.filters.q = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#f-q"); el.focus(); el.setSelectionRange(pos, pos); } });
$("#app").addEventListener("submit", e => {
  if (e.target.id !== "dept-add") return; e.preventDefault();
  const n = $("#dept-new").value.trim(); if (!n) { toast("Вкажіть назву відділу"); return; }
  act("adminSaveDept", { name: n }, "Відділ додано").catch(() => {});
});
$("#app").addEventListener("change", e => { if (e.target.id === "uf") { S.userFilter = e.target.value; render(); return; } const m = { "f-dept": "dept", "f-status": "status", "f-who": "who" }[e.target.id]; if (m) { S.filters[m] = e.target.value; render(); } });
$("#app").addEventListener("dragstart", e => { const c = e.target.closest(".kc"); if (c) { e.dataTransfer.setData("text/plain", c.dataset.id); c.classList.add("dragging"); } });
$("#app").addEventListener("dragend", e => { const c = e.target.closest(".kc"); if (c) c.classList.remove("dragging"); document.querySelectorAll(".kcol.drop").forEach(x => x.classList.remove("drop")); });
$("#app").addEventListener("dragover", e => { const col = e.target.closest(".kcol"); if (col) { e.preventDefault(); document.querySelectorAll(".kcol.drop").forEach(x => x !== col && x.classList.remove("drop")); col.classList.add("drop"); } });
$("#app").addEventListener("dragleave", e => { const col = e.target.closest(".kcol"); if (col && !col.contains(e.relatedTarget)) col.classList.remove("drop"); });
$("#app").addEventListener("drop", e => {
  const col = e.target.closest(".kcol"); if (!col) return; e.preventDefault(); col.classList.remove("drop");
  const it = S.items.find(i => i.id === e.dataTransfer.getData("text/plain"));
  if (it && it.status !== col.dataset.col) act("update", { id: it.id, patch: { status: col.dataset.col } }, `${it.id} → ${SL()[col.dataset.col]}`).catch(() => {});
});
window.addEventListener("beforeunload", e => { if (Object.keys(S.pending).length) { e.preventDefault(); e.returnValue = ""; } });
// автооновлення раз на 3 хв, якщо користувач нічого не редагує
setInterval(() => { if (!S.me || S.me.role === "public" || S.busy || S.view === "new" || S.open || Object.keys(S.pending).length || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) return;
  call("boot").then(apply).catch(() => {}); }, 180000);

act("boot").then(() => { if (OPEN_ID && S.items.some(i => i.id === OPEN_ID)) openCard(OPEN_ID); }).catch(() => {});
</script>

</body>
</html>
